<title>Duty Trip Timer</title>
<style>
:root{--aq:#00808d;--aql:#19c3d1;--aqt:#e4f4f6;--pri:#0b3c5d;--bg:#e9f3f6;--card:#fff;--tx:#12263a;--mu:#546a7b;--bd:#cfe1e8;--ok:#1b7f4b;--er:#b3261e;--rt:#fdeceb;--gt:#e6f4ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--aq:#4dd0e1;--aql:#26c6da;--aqt:#14313a;--pri:#26c6da;--bg:#0f1719;--card:#162124;--tx:#e6f0f2;--mu:#8fa6ad;--bd:#27383d;--ok:#5fd394;--er:#ff8a80;--rt:#3a1a19;--gt:#15301f}}
:root[data-theme="dark"]{--aq:#4dd0e1;--aql:#26c6da;--aqt:#14313a;--pri:#26c6da;--bg:#0f1719;--card:#162124;--tx:#e6f0f2;--mu:#8fa6ad;--bd:#27383d;--ok:#5fd394;--er:#ff8a80;--rt:#3a1a19;--gt:#15301f}
html{height:100%;-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 14px 28px}
.hd{background:linear-gradient(135deg,#072a47,#0b5a7a 62%,#00808d);border-bottom:4px solid #19c3d1;border-radius:10px;padding:14px 16px;color:#fff}
h1{margin:0;font-size:20px}.sub{margin:2px 0 0;font-size:13px;opacity:.85}
label{display:block;margin:14px 0 4px;font-size:12px;color:var(--mu)}
select{width:100%;height:44px;padding:0 10px;font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px}
.hero{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pri);border-radius:10px;padding:16px;text-align:center}
.hl{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
.big{margin:6px 0;font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--aq)}
.big.low{color:var(--er)}.hs{font-size:14px;color:var(--mu)}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:14px;font-size:13px}
.meta div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;text-align:center}
.meta b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.meta small{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-top:1px;min-height:14px}
.tr{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:10px;padding:10px 14px;opacity:.55;transition:opacity .3s,transform .3s,box-shadow .3s}
.tr.done{opacity:.35}
.tr.next{opacity:1;border-color:var(--er);border-left-color:var(--er);border-left-width:6px;background:var(--rt);box-shadow:0 4px 14px rgba(179,38,30,.2)}
.tr.run{opacity:1;border-color:var(--ok);border-left-color:var(--ok);border-left-width:6px;background:var(--gt);transform:scale(1.02);box-shadow:0 6px 18px rgba(27,127,75,.25);padding:14px 16px}
.tr.run .th{font-size:17px}
.tr.run .bg{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.tr.next .bg{background:var(--er);color:#fff;border-color:var(--er);font-weight:700}
.tr.run .bg,.bk.on{position:relative}
.tr.run .bg{display:inline-block;min-width:104px;text-align:center;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:.3px}
.tr.run .bg::after,.bk.on::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.22);pointer-events:none}
.fl{animation:flip .45s ease-out;transform-origin:50% 50%}
@keyframes flip{0%{transform:perspective(260px) rotateX(-90deg);opacity:.2}100%{transform:perspective(260px) rotateX(0);opacity:1}}
.th{display:flex;justify-content:space-between;align-items:center;font-weight:650}
.bg{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);text-transform:uppercase}

.lg{margin-top:4px;font-size:14px;font-variant-numeric:tabular-nums}.lg span{color:var(--mu)}
.bk{margin:8px auto 0;width:max-content;max-width:100%;padding:3px 12px;font-size:12px;color:var(--mu);border:1px dashed var(--bd);border-radius:8px;background:var(--card)}.bk{opacity:.55}.bk.dn{opacity:.35}.bk.on{opacity:1;font-weight:600;color:var(--ok);border:1px solid var(--ok);background:var(--gt);font-size:13px}.bk.nx{opacity:1;font-weight:600;color:var(--er);border:1px solid var(--er);background:var(--rt);font-size:13px}
.lg.ln i{font-style:normal;font-weight:700;color:var(--aq);padding:0 3px}.lg.ln{font-size:14px;color:var(--mu);text-align:center}.lg.ln b{color:var(--tx);font-weight:600}
.bk.on{min-width:104px;text-align:center;font-variant-numeric:tabular-nums}
